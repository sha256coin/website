name: Deploy S256 Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr
          path: ./
          remote_path: /home/janos/website
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}
          exclude: |
            .git/
            .github/
            node_modules/
            .env
            logs/
            .rsyncignore
            DEPLOYMENT.md
            docs/
            downloads/
            easter-egg.js
            package-lock.json
            whitepaper.pdf
            img/blockspot-500x500.png
            img/janos_profile.jpg
            img/logo-livecoinw.svg
            img/mps-app_logo.png
            *.txt
            *.md

      - name: Restart PM2 Processes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/janos/website
            # Install any new dependencies added to package.json
            npm install --production
            # Reload website
            pm2 startOrReload s256-website --update-env