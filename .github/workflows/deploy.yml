name: Deploy S256 Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # Files/folders to never overwrite or touch on the VPS. The action has
          # no exclude input, so they go in switches (run through sh -c, hence
          # the quotes). Served files (easter-egg.js, partner logos, robots.txt,
          # static/COIN_SUPPLY.txt) are not excluded so their changes deploy.
          switches: >-
            -avzr
            --exclude='.git/'
            --exclude='.github/'
            --exclude='node_modules/'
            --exclude='.env'
            --exclude='logs/'
            --exclude='/.rsyncignore'
            --exclude='/DEPLOYMENT.md'
            --exclude='/docs/'
            --exclude='/downloads/'
            --exclude='/package-lock.json'
            --exclude='/whitepaper.pdf'
            --exclude='/img/janos_profile.jpg'
            --exclude='*.md'
          path: ./
          remote_path: /home/janos/website
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      - name: Restart PM2 Processes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/janos/website
            # Install any new dependencies added to package.json
            npm install --production
            # Reload website
            pm2 reload s256-website --update-env